services:
  jupyter:
    build:
      context: ./docker
      dockerfile: Dockerfile
    container_name: curso-jupyter
    ports:
      - "8888:8888"
    volumes:
      - ./:/home/jovyan/work
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-curso2027}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-omop}
      POSTGRES_USER: ${POSTGRES_USER:-omop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-omop}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: curso-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-omop}
      POSTGRES_USER: ${POSTGRES_USER:-omop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-omop}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-omop} -d ${POSTGRES_DB:-omop}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Cliente web para explorar la base OMOP (sesiones 10-18)
  adminer:
    image: adminer:latest
    container_name: curso-adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  pgdata:
